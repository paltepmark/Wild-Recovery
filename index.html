<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <!-- Left Section -->
    <div class="left-section">
      <div class="brand-logo">
        <div class="logo-icon">✝</div>
        <div class="logo-text">
          UNIVERSITAS<br>
          KRISTEN<br>
          MARANATHA
        </div>
      </div>

      <div class="illustration-container">
        <svg width="200" height="180" viewBox="0 0 200 180" fill="none">
          <ellipse cx="100" cy="120" rx="90" ry="45" fill="#dcebe5" />
          <path d="M100 25 L135 75 L120 75 L150 120 L50 120 L80 75 L65 75 Z" fill="#254234" />
          <rect x="92" y="120" width="16" height="25" fill="#1b3326" />
          <polygon points="100,15 103,22 110,22 105,26 107,33 100,29 93,33 95,26 90,22 97,22" fill="#ffd700" />
          <circle cx="90" cy="60" r="4" fill="#e74c3c" />
          <circle cx="110" cy="80" r="4" fill="#e74c3c" />
          <circle cx="80" cy="100" r="4" fill="#e74c3c" />
          <circle cx="120" cy="105" r="4" fill="#e74c3c" />
        </svg>
      </div>

      <div class="left-footer">
        © 2019 Universitas Kristen Maranatha<br>
        Powered by NOC
      </div>
    </div>

    <!-- Right Section -->
    <div class="right-section">
      <h2 class="login-header">Login</h2>

      <form action="#">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="forgot-link">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-submit">Login to Wifi</button>
      </form>

      <div class="register-text">
        Don't have an account?<br>
        <a href="#">Register Now</a>
      </div>

      <div class="right-footer">
        <a href="#">Terms and Services</a>
        <div style="text-align: right;">
          Have a problem? Contact us at<br>
          <a href="mailto:NOC@maranatha.edu">NOC@maranatha.edu</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
